pipeline:
  name: cci-eap-edmdq-marketo
  identifier: cci-eap-edmdq-marketo
  description: ci for the cdp pipeline check routine
  tags: {}
  template:
    templateRef: account.glue_ci
    templateInputs:
      properties:
        ci:
          codebase:
            connectorRef: account.dnd_engineering_enterprise_github_connector
            repoName: cci-eap-edmdq-marketo
            build: <+input>
      stages:
        - stage:
            identifier: ci
            type: CI
            variables:
              - name: MAIN_BRANCH_NAME
                type: String
                value: main
              - name: TEST_LAYER
                type: String
                value: test
              - name: ARTIFACT_LAYER
                type: String
                value: build
              - name: AWS_REGION
                type: String
                value: us-east-2
              - name: AWS_ACCOUNT_ID
                type: String
                value: "069422982184"
              - name: S3_ARTIFACT_BUCKET
                type: String
                value: azure-devops-ci-storage-xm5r8j75nw
              - name: GLUE_BUCKET_PATH
                type: String
                value: cci-eap-edmdq-marketo
              - name: CUSTOM_PACKAGE_PREFIX
                type: String
                value: cci-eap-edmdq-marketo
      variables:
        - name: project_name
          type: String
          value: cci-eap-edmdq-marketo
        - name: upload_bucket
          type: String
          value: azure-devops-ci-storage-xm5r8j75nw
        - name: image_name
          type: String
          value: cci-eap-edmdq-marketo
        - name: tag_value
          type: String
          value: <+pipeline.executionId>
        - name: git_dir_for_nexus
          type: String
          value: /harness/.git
        - name: pull_ecr_url
          type: String
          value: 069422982184.dkr.ecr.us-east-2.amazonaws.com
        - name: ecr_url
          type: String
          value: 069422982184.dkr.ecr.us-east-2.amazonaws.com
        - name: SONAR_LOG_LEVEL
          type: String
          value: <+input>.default(INFO)
        - name: SONAR_PYTHON_VERSION
          type: String
          value: <+input>.default(3.9)
  projectIdentifier: enterprise_data_management
  orgIdentifier: eap
